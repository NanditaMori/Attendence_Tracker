                    <th class="col-4">Absent</th>
                </tr>
            </thead>
            <tbody>

        </table>
    </div>

            const rollNoCell = newRow.insertCell(0);
            const nameCell = newRow.insertCell(1);

            rollNoCell.innerHTML = rollNo;
